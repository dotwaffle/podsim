min_version = "2026.7.12"

[settings]
lockfile = true

[tool_alias]
govulncheck = "go:golang.org/x/vuln/cmd/govulncheck"

[tools]
actionlint = "1"
go = "1.27"
golangci-lint = "2"
govulncheck = "1"
node = "24"

[tasks.format]
description = "Format Go sources"
run = "golangci-lint fmt"

[tasks.lint]
description = "Run static analysis"
run = """
actionlint
go vet ./...
golangci-lint run
"""

[tasks.test]
description = "Run the quick test suite"
run = "go test ./..."

[tasks."test:race"]
description = "Run tests with the race detector"
run = "go test -race ./... -timeout=30m"

[tasks.vulncheck]
description = "Check dependencies for known vulnerabilities"
run = """
govulncheck ./...
GOOS=js GOARCH=wasm govulncheck ./cmd/podsim
"""

[tasks.build]
description = "Build all native packages"
run = "go build -trimpath ./..."

[tasks.web]
description = "Build the browser application"
run = "go generate ./..."

[tasks."test:embedded"]
description = "Check the embedded production server"
depends = ["web"]
run = "go test -tags=embed_assets . ./cmd/serve ./internal/session"

[tasks.serve]
description = "Build and serve the browser application"
depends = ["web"]
run = "go run ./cmd/serve"

[tasks."test:web"]
description = "Test editor model and project validation"
run = "node --test web/editor_test.cjs"

[tasks.check]
description = "Run tests, static analysis, and native and browser builds"
depends = ["test:race", "test:web", "lint", "vulncheck", "build", "test:embedded"]

[tasks.scenario]
description = "Write a generated scenario JSON file"
run = "go run ./cmd/scenario"

[tasks.compare]
description = "Compare redistribution against the same passenger requests"
run = "go run ./cmd/compare"

[tasks.qualify]
description = "Check scale, safety, and repeatability"
run = "go test ./internal/scenarios -count=1 -v"

[tasks.benchmark]
description = "Measure 6000 simulation steps on the 100-pod scenario"
run = "go test ./internal/scenarios -run '^$' -bench BenchmarkScale100StepActiveTraffic -benchtime=6000x -count=3 -benchmem"

min_version = "2026.7.12"

[settings]
lockfile = true

[tool_alias]
govulncheck = "go:golang.org/x/vuln/cmd/govulncheck"

[tools]
actionlint = "1"
go = "1.27"
golangci-lint = "2"
govulncheck = "1"
node = "24"
rumdl = "0.2"

[tasks.format]
description = "Format Go sources and Markdown"
run = '''
golangci-lint fmt
rumdl fmt .
'''

[tasks.lint]
description = "Run static analysis"
# depguard sees only direct imports in native files. The go list check
# fails when podsim.wasm links cloud storage through any path, and when
# go list itself fails.
run = '''
actionlint
rumdl check .
go vet ./...
golangci-lint run
deps=$(GOOS=js GOARCH=wasm go list -deps ./cmd/podsim ./cmd/editormodel) || exit 1
if printf '%s\n' "$deps" | grep -E '^(gocloud\.dev|github\.com/aws|cloud\.google\.com|google\.golang\.org/api|github\.com/dotwaffle/podsim/internal/statestore)(/|$)'; then
  echo "podsim.wasm must not link cloud storage" >&2
  exit 1
fi
'''

[vars]
# The two internal/sim race tasks use one pattern: the first runs the
# tests that match it and the second skips them, so together they run
# every test. The coupling, reassignment and station tests take about half
# of the package's race time.
sim_race_split = "^Test(Coupling|Reassign|Station)"

[tasks.test]
description = "Run the full test suite without the race detector"
run = "go test ./..."

# -short skips the long tests of sim, session, parkride, and compare.
# No CI task passes -short, so CI still runs them.
[tasks."test:quick"]
description = "Run the test suite without the long tests"
run = "go test -short ./..."

[tasks."test:race"]
description = "Run tests with the race detector"
depends = ["test:race:*"]

# test:race runs every test:race:* task, and CI runs each of them on its
# own runner. The sim and session packages take most of the race time,
# so they have their own tasks, and sim has two. test:race:other runs every other package, so
# a new package needs no change here. A new test:race:* task also needs
# an entry in the CI matrix.
[tasks."test:race:sim-stations"]
description = "Run the coupling, reassignment and station simulation tests with the race detector"
run = "go test -race ./internal/sim -timeout=30m -run '{{vars.sim_race_split}}'"

[tasks."test:race:sim-other"]
description = "Run the other simulation tests with the race detector"
run = "go test -race ./internal/sim -timeout=30m -skip '{{vars.sim_race_split}}'"

[tasks."test:race:session"]
description = "Run the session tests with the race detector"
run = "go test -race ./internal/session -timeout=30m"

[tasks."test:race:other"]
description = "Run the tests of the other packages with the race detector"
run = '''
packages=$(go list ./... | grep -v -x -e github.com/dotwaffle/podsim/internal/sim -e github.com/dotwaffle/podsim/internal/session) || exit 1
go test -race -timeout=30m $packages
'''

[tasks."test:bounds"]
description = "Check the maximum checkpoint encoding without race instrumentation"
run = "go test ./internal/parkride -run '^TestCheckpointCombinedEncodingShapes$' -count=1 -v"

[tasks.vulncheck]
description = "Check dependencies for known vulnerabilities"
run = """
govulncheck ./...
GOOS=js GOARCH=wasm govulncheck ./cmd/podsim ./cmd/editormodel
"""

[tasks.build]
description = "Build all native packages"
run = "go build -trimpath ./..."

[tasks.web]
description = "Build the browser application"
run = "go generate ./..."

[tasks."test:embedded"]
description = "Check the embedded production server"
depends = ["web"]
# The session package does not use the embed_assets tag, and test:race
# runs its other tests. The second command runs only the session tests
# that skip under -race or check more without it. Add such a test to
# this pattern, because a pattern that matches no test passes.
run = '''
go test -tags=embed_assets . ./cmd/serve
go test -tags=embed_assets ./internal/session -run '^(TestStateFileWorstCaseSize|TestExpressWidestSaveAdapters|TestExpressWidestStreamAdapters|TestExpressWidestTopologyHTTPAdapters|TestStreamMaximumEncoding|TestPackedTextWireCost|TestComposedWorstCaseFormats|TestCouplingSaveCapRejectsAtomically)$'
'''

[tasks.serve]
description = "Build and serve the browser application"
depends = ["web"]
run = "go run ./cmd/serve"

[tasks."test:web"]
description = "Test editor page, Go model client, game loader, and page shell"
# Without Go, the editor tests skip the tests that need a generated
# fixture. PODSIM_REQUIRE_GO makes a missing Go a failure, so the check
# task and CI stay strict.
env = { PODSIM_REQUIRE_GO = "1" }
run = "node --test web/editor-model_test.cjs web/place-search_test.cjs web/tiles_test.cjs web/simulation-map_test.cjs web/editor_test.cjs web/loader_test.cjs web/shell_test.cjs web/stream_test.cjs web/offline_test.cjs web/editor-history_test.cjs"

[tasks.check]
description = "Run tests, static analysis, and native and browser builds"
depends = ["test:race", "qualify", "check:static"]

[tasks."check:static"]
description = "Run the checks other than the race tests and qualify"
depends = ["test:bounds", "test:web", "lint", "vulncheck", "build", "test:embedded"]

[tasks.scenario]
description = "Write a generated scenario JSON file"
run = "go run ./cmd/scenario"

[tasks.compare]
description = "Run repeatable demand and policy experiments"
run = "go run ./cmd/compare"

[tasks.qualify]
description = "Run the Station 19 scale and safety tests and the emergency choice latency tests without the race detector"
# A long test that runs one simulation on one goroutine skips under -race,
# because the race detector finds nothing there and makes it 10 times
# slower. A test that measures time also skips under -race. The check
# task runs this task, so such a test must be in one of these patterns.
# Add it to a pattern, because a pattern that matches no test passes.
# test:race runs the other tests.
run = '''
go test ./internal/scenarios -count=1 -v -timeout=30m -run '^TestScale100Station19(Queue|Burst)DrainsSafely$' || exit 1
go test ./internal/sim -count=1 -v -timeout=30m -run '^(TestEmergencyChoiceLatency|TestEmergencyNoCandidateLatency)$'
'''

[tasks.benchmark]
description = "Measure 6000 simulation steps on the 100-pod scenario"
run = "go test ./internal/scenarios -run '^$' -bench BenchmarkScale100StepActiveTraffic -benchtime=6000x -count=3 -benchmem"

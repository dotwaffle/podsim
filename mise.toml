min_version = "2026.7.12"

[settings]
lockfile = true

[tool_alias]
govulncheck = "go:golang.org/x/vuln/cmd/govulncheck"

[tools]
actionlint = "1"
go = "1.27"
golangci-lint = "2"
govulncheck = "1"
node = "24"

[tasks.format]
description = "Format Go sources"
run = "golangci-lint fmt"

[tasks.lint]
description = "Run static analysis"
run = """
actionlint
go vet ./...
golangci-lint run
"""

[tasks.test]
description = "Run the quick test suite"
run = "go test ./..."

[tasks.test-race]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.vulncheck]
description = "Check dependencies for known vulnerabilities"
run = """
govulncheck ./...
GOOS=js GOARCH=wasm govulncheck ./cmd/podsim
"""

[tasks.build]
description = "Build all native packages"
run = "go build -trimpath ./..."

[tasks.web]
description = "Build the browser application"
run = """
mkdir -p dist
GOOS=js GOARCH=wasm go build -trimpath -o dist/podsim.wasm ./cmd/podsim
cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/wasm_exec.js
cp web/index.html web/game.html web/editor.html web/editor.css web/editor.js dist/
"""

[tasks.serve]
description = "Build and serve the browser application"
depends = ["web"]
run = "go run ./cmd/serve"

[tasks.test-web]
description = "Test editor model and project validation"
run = "node --test web/editor_test.cjs"

[tasks.check]
description = "Run tests, static analysis, and native and browser builds"
depends = ["test-race", "test-web", "lint", "vulncheck", "build", "web"]

min_version = "2026.11.1"

[settings]
lockfile = true

[env]
# Keep source paths out of the build cache keys, so that worktrees share compiled packages.
GOFLAGS = "-trimpath"
# The packages of test:long. See test:race:other.
PODSIM_LONG_PACKAGES = "./cmd/compare ./cmd/scenario ./internal/editormodel ./internal/project ./internal/scenarios"
# The long tests of cmd/compare that run worker goroutines.
PODSIM_RACE_LONG_TESTS = "^(TestDailyComparisonMatchesLiveOffers|TestAdaptiveLimitMatchesFullGrid|TestScreenRun)$"

[tool_alias]
govulncheck = "go:golang.org/x/vuln/cmd/govulncheck"

[tools]
actionlint = "1"
go = "1.27"
golangci-lint = "2"
govulncheck = "1"
node = "24"
rumdl = "0.3"

[tasks.format]
description = "Format Go sources and Markdown"
run = '''
golangci-lint fmt
rumdl fmt .
'''

[tasks.lint]
description = "Run static analysis"
# depguard sees only direct imports in native files. The go list check
# fails when podsim.wasm links cloud storage or the preset data through any
# path, and when go list itself fails.
run = '''
actionlint
rumdl check .
go vet ./...
golangci-lint run
deps=$(GOOS=js GOARCH=wasm go list -deps ./cmd/podsim ./cmd/editormodel ./cmd/ride) || exit 1
if printf '%s\n' "$deps" | grep -E '^(gocloud\.dev|github\.com/aws|cloud\.google\.com|google\.golang\.org/api|github\.com/dotwaffle/podsim/internal/statestore)(/|$)'; then
  echo "podsim.wasm must not link cloud storage" >&2
  exit 1
fi
if printf '%s\n' "$deps" | grep -E '^github\.com/dotwaffle/podsim/internal/scenarios(/|$)'; then
  echo "podsim.wasm must not link the preset data" >&2
  exit 1
fi
'''

[tasks.test]
description = "Run the full test suite without the race detector"
run = "go test ./..."

# -short skips the long tests of several packages.
# CI runs them all: test:long runs PODSIM_LONG_PACKAGES in full, and
# test:race:other runs the other packages without -short.
[tasks."test:quick"]
description = "Run the test suite without the long tests"
run = "go test -short ./..."

[tasks."test:race"]
description = "Run tests with the race detector"
depends = ["test:race:*"]

# test:race runs every test:race:* task, and CI runs each of them on its
# own runner. The sim and session packages take most of the race time,
# so they have their own tasks. test:race:other runs every other package, so
# a new package needs no change here. A new test:race:* task also needs
# an entry in the CI matrix.
[tasks."test:race:sim"]
description = "Run the simulation tests with the race detector"
run = "go test -race ./internal/sim -timeout=30m"

[tasks."test:race:session"]
description = "Run the session tests with the race detector"
run = "go test -race ./internal/session -timeout=30m"

# Most long tests of the packages in PODSIM_LONG_PACKAGES run on one
# goroutine, and the race detector makes them several times slower but
# finds nothing in them. So test:race:other runs these packages with -short,
# and test:long runs them in full without the race detector. The long tests
# in PODSIM_RACE_LONG_TESTS run more than one goroutine, so test:race:other
# also runs them in full with the race detector.
[tasks."test:race:other"]
description = "Run the tests of the other packages with the race detector"
run = '''
single="$PODSIM_LONG_PACKAGES"
packages=$(go list ./... | grep -v -x -e github.com/dotwaffle/podsim/internal/sim -e github.com/dotwaffle/podsim/internal/session) || exit 1
for package in $single; do
  packages=$(printf '%s\n' $packages | grep -v -x -e "github.com/dotwaffle/podsim/${package#./}") || exit 1
done
go test -race -timeout=30m $packages || exit 1
go test -race -short -timeout=30m $single || exit 1
go test -race -timeout=30m -run "$PODSIM_RACE_LONG_TESTS" ./cmd/compare
'''

[tasks."test:long"]
description = "Run the long tests of PODSIM_LONG_PACKAGES in full without the race detector"
run = 'go test -timeout=30m $PODSIM_LONG_PACKAGES'

# The qualification tests of the london-full-shared-express preset (rows
# SX2 to SX9, and the soak driver of SX10 and SX11) run one simulation of 9,089 lanes each. They skip under -race
# and with -short, so only this task runs them. Each pattern names each
# test, because a pattern that matches no test passes. Add a new test of
# these rows here.
[tasks."test:shared-express"]
description = "Run the shared-track Express qualification tests without the race detector"
run = '''
go test ./internal/sim -count=1 -timeout=20m -run '^(TestSharedExpressEnvelopeRun|TestSharedExpressShapePairSweep|TestSharedExpressDwell|TestSharedExpressOccupiedPickupPolicy)$' || exit 1
go test ./internal/sim -count=1 -timeout=20m -run '^TestEnvelopeSupportMixedSmall$/^london-full-shared-express$' || exit 1
go test ./internal/session -count=1 -timeout=20m -run '^(TestLondonSharedExpressPhysicalCheckpoints|TestLondonSharedExpressIncidentFixtures|TestLondonSharedExpressByteBounds|TestLondonSharedExpressRecoveryChain|TestSoakLondonSharedExpressDriver)$' || exit 1
go test ./internal/remote -count=1 -timeout=20m -run '^(TestLondonSharedExpressRemoteLoads|TestLondonSharedExpressRemoteRecovery)$'
'''

# The qualification tests of the london-full-express preset (project D)
# under the shape clearance rule. Most of them skip under -race and with
# -short, so check and a CI job of its own run this task. Each pattern
# names each test, because a pattern that matches no test passes. Add a
# new test of these rows here.
[tasks."test:london-express"]
description = "Run the qualification tests of the London Express preset without the race detector"
run = '''
go test ./internal/scenarios -count=1 -timeout=20m -run '^(TestLondonFullExpress|TestLondonFullExpressRoutes)$' || exit 1
go test ./internal/sim -count=1 -timeout=20m -run '^(TestLondonExpressEnvelopeRun|TestEnvelopeMatchesReference)$' || exit 1
go test ./internal/sim -count=1 -timeout=20m -run '^TestEnvelopeSupportMixedSmall$/^london-full-express$' || exit 1
go test ./internal/session -count=1 -timeout=30m -run '^(TestLondonExpressPhysicalCheckpoints|TestLondonExpressIncidentFixtures|TestSoakLondonExpressDriver)$' || exit 1
go test ./internal/remote -count=1 -timeout=20m -run '^(TestLondonExpressRemoteLoads|TestLondonExpressRemoteRecovery)$'
'''

[tasks.vulncheck]
description = "Check dependencies for known vulnerabilities"
run = """
govulncheck ./...
GOOS=js GOARCH=wasm govulncheck ./cmd/podsim ./cmd/editormodel ./cmd/ride
"""

[tasks.build]
description = "Build all native packages"
run = "go build -trimpath ./..."

[tasks.web]
description = "Build the browser application"
run = "go generate ./..."

[tasks."test:embedded"]
description = "Check the embedded production server"
depends = ["web"]
# The session package does not use the embed_assets tag, and test:race
# runs its other tests. The second command runs only the session tests
# that skip under -race or check more without it. Add such a test to
# this pattern, because a pattern that matches no test passes.
run = '''
go test -tags=embed_assets . ./cmd/serve
go test -tags=embed_assets ./internal/session -run '^(TestPackedTextWireCost|TestSaveCapRejectsAtomically|TestDecodeCapsAtCallers|TestEncodeCapsAtCallers|TestTopologyPreflightAtCallers|TestPlainStateFileWorstCaseSize|TestPlainStreamMaximumEncoding|TestExpressStateFileWorstCaseSize|TestExpressStreamMaximumEncoding|TestPresetPoliciesRestore)$'
'''

[tasks.serve]
description = "Build and serve the browser application"
depends = ["web"]
run = "go run ./cmd/serve"

[tasks."test:web"]
description = "Test editor page, Go model client, game loader, and page shell"
# Without Go, the editor tests skip the tests that need a generated
# fixture. PODSIM_REQUIRE_GO makes a missing Go a failure, so the check
# task and CI stay strict.
env = { PODSIM_REQUIRE_GO = "1" }
run = "node --test web/editor-model_test.cjs web/place-search_test.cjs web/tiles_test.cjs web/simulation-map_test.cjs web/editor_test.cjs web/loader_test.cjs web/shell_test.cjs web/stream_test.cjs web/offline_test.cjs web/editor-history_test.cjs web/ride_test.cjs"

# check runs its parts one after another. In parallel they overload one
# machine, and the latency tests of qualify then fail. CI runs each part
# on its own runner, so it does not use this task.
[tasks.check]
description = "Run tests, static analysis, and native and browser builds"
run = [
  { task = "check:static" },
  { task = "qualify" },
  { task = "test:race:sim" },
  { task = "test:race:session" },
  { task = "test:race:other" },
  { task = "test:long" },
  { task = "test:shared-express" },
  { task = "test:london-express" },
]

[tasks."check:static"]
description = "Run the checks other than the race tests and qualify"
depends = ["test:web", "lint", "vulncheck", "build", "test:embedded"]

[tasks.scenario]
description = "Write a generated scenario JSON file"
run = "go run ./cmd/scenario"

[tasks.compare]
description = "Run repeatable demand and policy experiments"
run = "go run ./cmd/compare"

[tasks."qualify:london"]
description = "Qualify matched London fleets at normal and overloaded demand without the race detector"
run = "PODSIM_QUALIFY_LONDON=1 go test -p 1 ./internal/session -count=1 -v -timeout=10m -run '^TestLondonFleetQualification$'"

[tasks.qualify]
description = "Run the Station 19 scale and safety tests, the emergency choice and sampled-tick latency gates, and the CI incident soak without the race detector"
# A long test that runs one simulation on one goroutine skips under -race,
# because the race detector finds nothing there and makes it 10 times
# slower. A test that measures time also skips under -race. The check
# task runs this task, so such a test must be in one of these patterns.
# Add it to a pattern, because a pattern that matches no test passes.
# test:race runs the other tests.
# The Station 19 drain tests, TestEmergencyNoCandidateLatency, and the CI
# incident soak skip without PODSIM_QUALIFY=1, so they run only in this
# task. The report of qualify:limits gates nothing, so it is not here.
run = '''
PODSIM_QUALIFY=1 go test ./internal/scenarios -count=1 -v -timeout=30m -run '^TestScale100Station19(Queue|Burst)DrainsSafely$' || exit 1
PODSIM_QUALIFY=1 go test ./internal/sim -count=1 -v -timeout=30m -run '^(TestEmergencyChoiceLatency|TestEmergencyNoCandidateLatency|TestSampledTickLatency)$' || exit 1
PODSIM_QUALIFY=1 go test ./internal/session -count=1 -v -timeout=30m -run '^TestIncidentSoakCI$'
'''

[tasks."qualify:limits"]
description = "Report the sampled-tick time at the project limits, on request, with no gate"
run = "PODSIM_QUALIFY=1 go test ./internal/sim -count=1 -v -timeout=30m -run '^TestSampledTickNoCandidateLatency$'"

[tasks.soak]
description = "Run the incident soak in the routine branch shape, one soak at a time"
# The lock holds for one host, so each worktree uses the same path.
# A second soak waits for 60 seconds and then fails with code 75.
env = { PODSIM_SOAK = "1" }
run = '''
ulimit -v 16000000
lock="${PODSIM_SOAK_LOCK:-/tmp/podsim-soak.lock}"
status=0
flock --wait 60 --conflict-exit-code 75 "$lock" \
  timeout "${PODSIM_SOAK_LIMIT:-7200}" \
  go test ./internal/session -count=1 -v -timeout=0 -parallel "${PODSIM_SOAK_PARALLEL:-3}" -run '^TestIncidentSoak$' || status=$?
if [ "$status" -eq 75 ]; then
  echo "another soak holds $lock" >&2
fi
exit "$status"
'''

[tasks."soak:full"]
description = "Run the release soak of amendments A6 and A19 with the full check at each tick, and list the seeds that finished"
# Amendment A12 requires this run before a release tag. The wall limit
# of the soak task stays at 2 hours. By amendment A19, the run has 2 seeds of
# each preset, and a run that the limit stops fails. The file lists the seeds
# that finished, to show how far a stopped run got. Each run has its own file,
# so a run that does not get the lock leaves the record of the run that holds it.
# Amendment A16 adds the London Express preset to the default presets, and
# row SX11 of the shared-track qualification adds the shared-track preset.
run = '''
finished="${PODSIM_SOAK_FINISHED:-$(mktemp /tmp/podsim-soak-finished.XXXXXX)}"
status=0
PODSIM_SOAK_FINISHED="$finished" PODSIM_SOAK_SHAPE=seeds PODSIM_SOAK_EVERY_TICK=1 \
  PODSIM_SOAK_PRESETS="${PODSIM_SOAK_PRESETS:-rail-hub,london-central,london-full-express,london-full-shared-express}" mise run soak || status=$?
echo "seeds that finished, from $finished (exit status $status):"
cat "$finished"
exit "$status"
'''

[tasks.benchmark]
description = "Measure 6000 simulation steps on the 100-pod scenario"
run = "go test ./internal/scenarios -run '^$' -bench BenchmarkScale100StepActiveTraffic -benchtime=6000x -count=3 -benchmem"

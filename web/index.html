<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podsim: Network playground</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b121a; }
    /* The game and editor frames fill the page, one on top of the other.
       The inactive frame has the inert attribute. It stays in the layout
       with its size, so the game does not fit the map again when it shows. */
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    iframe[inert] { visibility: hidden; }
    /* The shell controls are for keyboard users. The game draws its own
       Edit scenario and Download debug state buttons, and the editor has its
       own return link. As with a skip link, a control is hidden until it
       gets the keyboard focus. Then it shows in the top left corner.
       Until the game in the frame tells the shell that it is ready, the nav
       has the fallback class. Then the controls of the game show in a row in
       the top left corner. See PodsimShell.controlsShow.
       The debug status is for screen readers. While the nav has the
       fallback class, the debug status also shows next to the controls.
       A failure shows in amber. See PodsimShell.reconcileResult. */
    nav { position: absolute; top: 8px; left: 8px; z-index: 1; display: flex; gap: 8px; }
    nav a, nav button { padding: 6px 12px; border: 1px solid #345064; border-radius: 7px; background: #101d28; color: #9fe4eb; font: 14px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    #debugStatus { align-self: center; padding: 6px 12px; border-radius: 7px; background: #101d28; color: #9fe4eb; font: 14px system-ui, sans-serif; }
    #debugStatus.error { color: #f3c479; }
    nav:not(.fallback) a:not(:focus), nav:not(.fallback) button:not(:focus), nav:not(.fallback) #debugStatus, #debugStatus:empty { position: absolute; width: 1px; height: 1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
  <script src="shell.js"></script>
</head>
<body>
  <nav aria-label="Scenario tools" class="fallback">
    <a id="editorLink" href="#editor">Edit scenario</a>
    <button id="gameButton" type="button" hidden>Simulation</button>
    <button id="debugButton" type="button" title="Save the current run for debugging. This capture cannot be reloaded.">Download debug state</button>
    <span id="debugStatus" role="status"></span>
  </nav>
  <main>
    <iframe id="gameFrame" src="game.html" title="Podsim interactive network simulation"></iframe>
  </main>
  <script>
    // frames has the game frame and the editor frame. The editor frame is
    // null until the editor shows for the first time. view is the name of
    // the frame that shows.
    const frames = { game: document.getElementById("gameFrame"), editor: null };
    let view = "game";
    const button = document.getElementById("debugButton");
    const status = document.getElementById("debugStatus");
    // gameReady is true after the game frame load sent a ready message with
    // the message version of this page. See PodsimShell.gameReady.
    // updateControls shows the shell controls without the focus when
    // PodsimShell.controlsShow tells it to.
    const nav = document.querySelector("nav");
    let gameReady = false;
    function updateControls(change) {
      gameReady = PodsimShell.gameReady(gameReady, change);
      nav.classList.toggle("fallback", PodsimShell.controlsShow(view, gameReady));
      reconcileStatus();
    }
    frames.game.addEventListener("load", () => updateControls("load"));
    // Ebitengine does not focus its canvas inside an iframe. Give the game the
    // keyboard focus, so that its keyboard shortcuts work without a click. Do
    // not take the focus from a different control that the user selected,
    // and do not take it from the editor.
    function focusGame() {
      if (view === "game" && (document.activeElement === document.body || document.activeElement === button)) frames.game.focus();
    }
    frames.game.addEventListener("load", focusGame);
    // When the browser restores this page from its back/forward cache, the
    // frames get no load event. Give the frame that shows the focus, as
    // after a new load.
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) frames[view].focus();
    });

    // debugResult is the active result of a debug capture, or null. See
    // PodsimShell.debugResult. reconcileStatus sends the result to the game
    // when the game is ready and did not get it. While the game is not
    // ready, the debug status shows the result next to the shell controls.
    // See PodsimShell.reconcileResult.
    let debugResult = null;
    function reconcileStatus() {
      const { result, notice } = PodsimShell.reconcileResult(debugResult, gameReady, Date.now());
      debugResult = result;
      if (notice) frames.game.contentWindow?.postMessage(notice, location.origin);
    }
    // showStatus sets the text of the debug status. The status is a live
    // region, so a screen reader reads it. result is true for the result of
    // a capture. error is true when the text tells of a failure. A result
    // without a failure goes after a short time.
    let statusTimer;
    function showStatus(text, result, error = false) {
      clearTimeout(statusTimer);
      status.textContent = text;
      status.classList.toggle("error", error);
      debugResult = result ? PodsimShell.debugResult(text, error, Date.now()) : null;
      if (debugResult?.expiresAt != null) {
        statusTimer = setTimeout(() => {
          status.textContent = "";
          debugResult = null;
        }, debugResult.expiresAt - Date.now());
      }
      reconcileStatus();
    }
    // captureDebugState downloads a debug capture of the server state. The
    // Download debug state control and the button of the same name in the
    // game start it. While a capture runs, a new request does nothing.
    let capturing = false;
    async function captureDebugState() {
      if (capturing) return;
      capturing = true;
      const requestedAt = new Date().toISOString();
      button.disabled = true;
      showStatus("Capturing…", false);
      try {
        const signal = AbortSignal.timeout(15000);
        const [stateResponse, topologyResponse] = await Promise.all([
          fetch("/api/state", { cache: "no-store", signal, headers: { Accept: PodsimShell.STATE_ACCEPT } }),
          fetch("/api/topology", { cache: "no-store", signal }),
        ]);
        const frame = await PodsimShell.readCaptureState(stateResponse);
        if (!topologyResponse.ok) throw new Error(`Topology HTTP ${topologyResponse.status}`);
        const topology = await topologyResponse.json();
        if (frame.epoch !== topology.epoch || frame.projectRevision !== topology.projectRevision) {
          throw new Error("State changed while capturing");
        }
        const state = { ...frame, network: topology.network };
        if (!state.network || !state.simulation || !Number.isSafeInteger(state.simulation.tick)) {
          throw new Error("Invalid server state");
        }
        const capture = { ...state, debugCapture: { version: 2, requestedAt, receivedAt: new Date().toISOString() } };
        const url = URL.createObjectURL(new Blob([JSON.stringify(capture, null, 2)], { type: "application/json" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = `podsim-debug-${requestedAt.replace(/[:.]/g, "-")}-tick-${state.simulation.tick}.json`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showStatus(`Debug state downloaded: tick ${state.simulation.tick}.`, true);
      } catch (error) {
        showStatus(`Capture failed. ${error.message}. Try again.`, true, true);
      } finally {
        button.disabled = false;
        capturing = false;
      }
    }
    button.addEventListener("click", async (event) => {
      await captureDebugState();
      // Give the game the focus only after a mouse or touch click. After
      // Enter or Space on the button, the click detail is 0. The game keeps
      // the Tab key, so do not move a keyboard user into the game.
      if (event.detail > 0) focusGame();
    });

    // show shows the frame of next and makes the other frame inert. The
    // editor frame loads the first time that the editor shows, so it does
    // not slow the game load. The page title and the shell controls follow
    // the frame that shows. After a switch, that frame gets the keyboard
    // focus. When keyboard is true and next is the game, the Edit scenario
    // control gets the focus. See PodsimShell.focusTarget.
    function show(next, keyboard = false) {
      if (next === view) return;
      if (next === "editor" && !frames.editor) {
        frames.editor = Object.assign(document.createElement("iframe"), { src: "editor.html", title: "Podsim scenario editor" });
        frames.game.after(frames.editor);
      }
      view = next;
      for (const [name, frame] of Object.entries(frames)) if (frame) frame.inert = name !== view;
      for (const id of PodsimShell.CONTROLS) document.getElementById(id).hidden = !PodsimShell.VIEWS[view].controls.includes(id);
      updateControls();
      document.title = PodsimShell.VIEWS[view].title;
      const target = PodsimShell.focusTarget(view, keyboard);
      (frames[target] ?? document.getElementById(target)).focus();
    }
    // select shows next and adds a history entry with the URL hash of next,
    // so that the Back button shows the frame from before.
    function select(next, keyboard) {
      const url = new URL(location.href);
      url.hash = PodsimShell.VIEWS[next].hash;
      if (url.href !== location.href) history.pushState(null, "", url);
      show(next, keyboard);
    }
    // The URL hash selects the frame. The Edit scenario control, the Back
    // button and the Forward button change the hash.
    window.addEventListener("hashchange", () => show(PodsimShell.viewForHash(location.hash)));
    // After Enter or Space on the button, the click detail is 0.
    document.getElementById("gameButton").addEventListener("click", (event) => select("game", event.detail === 0));
    // A frame sends a request with a message. The editor asks for the game
    // with its return link. The game asks for the editor and for a debug
    // capture with its header buttons. The game also asks for a reload when
    // the server build changes, and it tells the shell when it is ready.
    window.addEventListener("message", (event) => {
      const request = PodsimShell.pageRequest(event, location.origin, frames.game.contentWindow);
      switch (request?.action) {
        case "show":
          select(request.view, request.keyboard);
          break;
        case "debug":
          captureDebugState();
          break;
        case "reload":
          if (PodsimShell.reloadTarget(frames.editor !== null) === "page") {
            location.reload();
            break;
          }
          // The new game can be of a different build. Show the controls
          // until it is ready.
          updateControls("load");
          frames.game.contentWindow.location.reload();
          break;
        case "ready":
          updateControls(request);
          break;
      }
    });
    // podsimShell tells the editor and the game that this page can show
    // them.
    window.podsimShell = true;
    show(PodsimShell.viewForHash(location.hash));
  </script>
</body>
</html>

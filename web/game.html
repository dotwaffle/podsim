<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podsim</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b121a; color: #e5edf5; font: 16px system-ui, sans-serif; }
    #status { position: absolute; inset: 40% 10% auto; text-align: center; z-index: 5; }
    /* The game reads touches as taps, pans, and pinch zooms. Do not let the
       browser scroll or zoom the page. */
    canvas { touch-action: none; }
    body > canvas:not(.tile-canvas) { position: relative; z-index: 1; }
    #simulationMap { position: absolute; pointer-events: none; transform-origin: 0 0; z-index: 0; }
    #simulationMapControls { position: absolute; z-index: 3; padding: 4px 7px; border-radius: 4px; background: #101d28ed; font: 12px system-ui, sans-serif; }
    #simulationMapControls[hidden] { display: none; }
    #simulationMapStatus { display: block; max-width: 300px; color: #f3c479; }
    #simulationMapStatus:empty, #simulationMapStatus[hidden] { display: none; }
    #streamDiagnostics { position: absolute; right: 8px; bottom: 8px; z-index: 4; max-width: min(330px, calc(100vw - 32px)); max-height: 65vh; overflow: auto; padding: 7px 10px; border: 1px solid #496174; border-radius: 5px; background: #101d28; font: 12px system-ui, sans-serif; }
    #streamDiagnostics summary { cursor: pointer; }
    #streamDiagnostics dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
    #streamDiagnostics dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    #streamDiagnostics p { color: #b7c8d6; line-height: 1.4; }
  </style>
  <script src="wasm_exec.js"></script>
  <script src="loader.js"></script>
  <script src="stream.js"></script>
</head>
<body>
  <div id="simulationMap"></div>
  <div id="simulationMapControls" hidden>
    <label><input id="showMap" type="checkbox"> Show map</label>
    <button id="retryMap" type="button" hidden>Retry map</button>
    <span id="simulationMapStatus" role="status" aria-live="polite"></span>
  </div>
  <script src="tiles.js"></script>
  <script src="simulation-map.js"></script>
  <div id="status" role="status">Loading Podsim…</div>
  <script>
    // Ebitengine does not focus its canvas inside an iframe, and it reads the
    // keys only from the canvas. Focus the canvas when the game starts and
    // each time that this page gets the focus, so that the keyboard shortcuts
    // work without a click. Do not take the focus from the top page.
    function focusCanvas() {
      if (document.hasFocus()) document.querySelector("canvas:not(.tile-canvas)")?.focus();
    }
    window.addEventListener("focus", focusCanvas);

    // Ebitengine reads Shift only from key events on its canvas. When the
    // top page has the keyboard focus, the game does not see Shift. Keep the
    // Shift state of the last pointer event, so that Shift+click on the map
    // works without the focus.
    function keepPointerShift(event) {
      globalThis.podsimPointerShift = event.shiftKey;
    }
    window.addEventListener("pointerdown", keepPointerShift, true);
    window.addEventListener("pointerup", keepPointerShift, true);

    // show sets the status text. A live region with aria-busy does not
    // announce each change of the download counter. It announces the status
    // when the download ends.
    const status = document.getElementById("status");
    function show(text, busy) {
      status.hidden = false;
      status.textContent = text;
      if (busy) status.setAttribute("aria-busy", "true");
      else status.removeAttribute("aria-busy");
    }

    // loader.js has the start steps. Without it, the page can only tell the
    // user that the start failed.
    if (typeof PodsimLoader === "undefined") {
      show("Podsim could not start. The loader script did not load.", false);
    } else {
      PodsimLoader.start({
        createGo: () => new Go(),
        fetchModule: () => fetch("podsim.wasm"),
        instantiate: (response, imports) => WebAssembly.instantiateStreaming(response, imports),
        show,
        started() {
          status.hidden = true;
          status.removeAttribute("aria-busy");
          focusCanvas();
        },
      });
    }
  </script>
</body>
</html>

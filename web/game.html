<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podsim</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b121a; color: #e5edf5; font: 16px system-ui, sans-serif; }
    #status { position: absolute; inset: 40% 10% auto; text-align: center; z-index: 1; }
  </style>
  <script src="wasm_exec.js"></script>
</head>
<body>
  <div id="status" role="status">Loading Podsim…</div>
  <script>
    // Ebitengine does not focus its canvas inside an iframe, and it reads the
    // keys only from the canvas. Focus the canvas when the game starts and
    // each time that this page gets the focus, so that the keyboard shortcuts
    // work without a click. Do not take the focus from the top page.
    function focusCanvas() {
      if (document.hasFocus()) document.querySelector("canvas")?.focus();
    }
    window.addEventListener("focus", focusCanvas);

    // Ebitengine reads Shift only from key events on its canvas. When the
    // top page has the keyboard focus, the game does not see Shift. Keep the
    // Shift state of the last pointer event, so that Shift+click on the map
    // works without the focus.
    function keepPointerShift(event) {
      globalThis.podsimPointerShift = event.shiftKey;
    }
    window.addEventListener("pointerdown", keepPointerShift, true);
    window.addEventListener("pointerup", keepPointerShift, true);

    async function start() {
      const status = document.getElementById("status");
      try {
        const go = new Go();
        const response = await fetch("podsim.wasm");
        if (!response.ok) throw new Error(`Download failed: HTTP ${response.status}`);
        const result = await WebAssembly.instantiateStreaming(response, go.importObject);
        const running = go.run(result.instance);
        status.hidden = true;
        focusCanvas();
        await running;
        throw new Error("The simulation stopped. Reload this page to restart.");
      } catch (error) {
        status.hidden = false;
        status.textContent = `Podsim could not start. ${error.message}`;
        console.error(error);
      }
    }
    start();
  </script>
</body>
</html>

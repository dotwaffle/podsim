name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.task }})
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        task: ["test:race:sim", "test:race:session", "test:race:other", "qualify", "check:static"]
    steps:
      - uses: actions/checkout@v7
      - name: Install graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 libgl1 libglx-mesa0
      - uses: jdx/mise-action@v5
      - name: Locate Go caches
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules, build outputs, and lint analysis
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
            ~/.cache/golangci-lint
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.task }}-${{ hashFiles('mise.lock', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.task }}-${{ hashFiles('mise.lock', 'go.sum') }}-
      - name: Check
        env:
          TASK: ${{ matrix.task }}
        run: mise run "$TASK"


name: Check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.task }})
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        task: ["test:race:sim-stations", "test:race:sim-other", "test:race:session", "test:race:other", "qualify", "check:static"]
    steps:
      - uses: actions/checkout@v7
      - name: Install graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 libgl1 libglx-mesa0
      - uses: jdx/mise-action@v5
      - name: Locate Go caches
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules, build outputs, and lint analysis
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
            ~/.cache/golangci-lint
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.task }}-${{ hashFiles('mise.lock', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.task }}-${{ hashFiles('mise.lock', 'go.sum') }}-
      - name: Check
        env:
          TASK: ${{ matrix.task }}
        run: mise run "$TASK"

  publish:
    # Publish only a version tag or a manual run, and only after every
    # check passed. A push to main runs the checks only.
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build browser application
        run: mise run web
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Publish image
        shell: bash
        run: |
          tags="${GITHUB_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${GITHUB_REF_NAME},latest,${tags}"
          fi
          ko build --bare --tags "${tags}" ./cmd/serve

syntax = "proto3";

package podsim.v1;

option go_package = "github.com/dotwaffle/podsim/internal/gen/podsim/v1;podsimv1";

service PodsimService {
  rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);
  rpc GetState(GetStateRequest) returns (GetStateResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc Command(CommandRequest) returns (CommandResponse);
}

message GetTopologyRequest {}
message GetStateRequest {}
message GetProjectRequest {}

message Point {
  double x = 1;
  double y = 2;
}

message Node {
  string id = 1;
  Point position = 2;
}

message Lane {
  string id = 1;
  string from = 2;
  string to = 3;
  double speed_limit = 4;
  string separation_group = 5;
  string station_id = 6;
  string station_role = 7;
  Point control = 8;
}

message Berth {
  string id = 1;
  string node = 2;
  string separation_group = 3;
}

message Station {
  string id = 1;
  string name = 2;
  string entry = 3;
  string exit = 4;
  repeated Berth berths = 5;
  bool parking_only = 6;
}

message Network {
  repeated Node nodes = 1;
  repeated Lane lanes = 2;
  repeated Station stations = 3;
}

message Placement {
  string id = 1;
  string station_id = 2;
  string berth_id = 3;
}

message DemandConfig {
  bool enabled = 1;
  int32 per_minute = 2;
  string pattern = 3;
  uint64 seed = 4;
  string destination = 5;
  string profile = 6;
  string band = 7;
}

message DemandBand {
  string id = 1;
  string name = 2;
  int32 start_minute = 3;
  int32 duration_minutes = 4;
}

message DemandFlow {
  string from = 1;
  string to = 2;
  repeated double weights = 3;
}

message DemandProfile {
  string id = 1;
  string name = 2;
  repeated DemandBand bands = 3;
  repeated DemandFlow flows = 4;
}

message Project {
  int32 version = 1;
  string name = 2;
  Network network = 3;
  repeated Placement fleet = 4;
  DemandConfig demand = 5;
  repeated DemandProfile demand_profiles = 6;
  int32 shared_ride_party_limit = 7;
  bool redistribution = 8;
}

message GetTopologyResponse {
  string epoch = 1;
  uint64 project_revision = 2;
  Network network = 3;
}

message GetProjectResponse {
  uint64 revision = 1;
  Project project = 2;
}

message Request {
  int32 id = 1;
  string from = 2;
  string to = 3;
  int32 party_size = 4;
  string pod_id = 5;
  bool completed = 6;
  int64 requested_tick = 7;
  string dispatch_reason = 8;
}

message Pod {
  string id = 1;
  Point position = 2;
  string activity = 3;
  string station_id = 4;
  string berth_id = 5;
  string lane_id = 6;
  double lane_distance = 7;
  double speed = 8;
  bool occupied = 9;
  string wait_reason = 10;
  string blocked_by = 11;
  string station_phase = 12;
  string maneuver_station_id = 13;
}

message VehicleFrame {
  Pod pod = 1;
  Request request = 2;
  repeated string route_lane_ids = 3;
  int32 parties = 4;
  string relocating_to = 5;
  bool rebalancing = 6;
}

message BerthState {
  string id = 1;
  string occupant = 2;
  string reserved_by = 3;
}

message WaitStats {
  double average_seconds = 1;
  double max_seconds = 2;
}

message SimulationFrame {
  int32 submitted = 1;
  int64 tick = 2;
  bool paused = 3;
  repeated VehicleFrame vehicles = 4;
  repeated BerthState berths = 5;
  int32 completed = 6;
  bool demo = 7;
  string demo_error = 8;
  repeated Request pending = 9;
  WaitStats wait = 10;
  double passenger_distance_meters = 11;
  int32 shared_parties = 12;
  int32 shared_ride_party_limit = 13;
  double empty_distance_meters = 14;
  int32 rebalance_moves = 15;
}

message DemandState {
  DemandConfig config = 1;
  int32 generated = 2;
  int32 skipped = 3;
  string error = 4;
}

message GetStateResponse {
  string epoch = 1;
  uint64 revision = 2;
  uint64 project_revision = 3;
  uint64 generation = 4;
  bool redistribution = 5;
  SimulationFrame simulation = 6;
  int32 speed = 7;
  DemandState demand = 8;
}

message TripCommand {
  string origin = 1;
  string destination = 2;
}

message PauseCommand {
  bool paused = 1;
}

message SpeedCommand {
  int32 speed = 1;
}

message ResetCommand {}
message DemoCommand {}

message DemandCommand {
  DemandConfig demand = 1;
}

message ProjectCommand {
  uint64 project_revision = 1;
  Project project = 2;
}

message CommandRequest {
  string client = 1;
  uint64 sequence = 2;
  string epoch = 3;
  oneof command {
    TripCommand trip = 10;
    PauseCommand pause = 11;
    SpeedCommand speed = 12;
    ResetCommand reset = 13;
    DemoCommand demo = 14;
    DemandCommand demand = 15;
    ProjectCommand project = 16;
  }
}

enum CommandErrorCode {
  COMMAND_ERROR_CODE_UNSPECIFIED = 0;
  COMMAND_ERROR_CODE_SESSION_CHANGED = 1;
  COMMAND_ERROR_CODE_INVALID_COMMAND = 2;
  COMMAND_ERROR_CODE_EXPIRED_COMMAND = 3;
  COMMAND_ERROR_CODE_SEQUENCE_CONFLICT = 4;
  COMMAND_ERROR_CODE_CLIENT_LIMIT = 5;
  COMMAND_ERROR_CODE_COMMAND_REJECTED = 6;
}

message CommandResponse {
  string epoch = 1;
  uint64 revision = 2;
  uint64 project_revision = 3;
  uint64 generation = 4;
  int32 order_id = 5;
  CommandErrorCode error_code = 6;
  string error = 7;
}
